<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fit India App Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@500;600;700;800&display=swap">
<style>
/* Layout: a light product-review shell with two tabs; a 16:9 deck scaled to fit, and a live phone concept on a quiet stage. One committed light look. */
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --ink:#121416; --ink2:#5D6369; --ink3:#9AA0A6; --hair:#E6E8E3; --soft:#F6F7F4;
  --saffron:#F26B1D; --saffron-d:#D85A10; --saffron-l:#FDECE0;
  --green:#0E9F6E; --green-d:#0B7F58; --green-l:#DFF3EA;
  --indigo:#4B5BDC; --indigo-d:#3A48B8; --indigo-l:#E7E9FB;
  --rose:#E2475E; --rose-l:#FCE6EA;
  --violet:#7B5BD6; --violet-l:#EEE9FB;
  --gold:#B8862B; --gold-l:#F7EED9;
  --tri-s:#FF9933; --tri-g:#138808;
  --f-ui:"Manrope","Noto Sans Devanagari","Noto Sans Tamil",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ===== Shell ===== */
.shell{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-inline:20px;background:var(--card);border-bottom:1px solid var(--hair);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.tri{display:flex;flex-direction:column;width:6px;height:22px;border-radius:3px;overflow:hidden}
.tri i{flex:1}.tri i:nth-child(1){background:var(--tri-s)}.tri i:nth-child(2){background:#E9EAE5}.tri i:nth-child(3){background:var(--tri-g)}
.mark small{font-weight:600;color:var(--ink3);font-size:14px}
.tabs{display:flex;background:var(--soft);border:1px solid var(--hair);border-radius:12px;padding:3px;gap:2px}
.tabs button{padding:8px 16px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--hair)}
.logos{display:flex;align-items:center;gap:14px;min-width:0}
#hdrLogos{flex:1 1 auto;overflow:hidden}
.tabs{flex:none}
.cbtn{white-space:nowrap}
.logos .sep{width:1px;align-self:stretch;background:var(--hair)}
.logo{display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo img{display:block;height:100%;width:auto}
.logo.ph-logo{border:1.5px dashed #C9CDC6;border-radius:8px;color:var(--ink3);font-weight:800;letter-spacing:.04em;white-space:nowrap;background:var(--soft)}
@media (max-width:760px){.bar{padding-inline:12px}.tabs button{padding:7px 10px;font-size:13px}.logos{gap:6px}.logos .sep{display:none}#hdrLogos .logo{height:26px!important}#hdrLogos .logo.ph-logo{font-size:8.5px!important;padding:0 5px!important}}
.pane{flex:1;min-height:0;position:relative}

/* ===== Deck ===== */
.deck{display:flex;flex-direction:column;height:100%;background:#E9EBE6}
.stagewrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;box-shadow:0 30px 80px -30px rgba(16,24,40,.35);border-radius:6px;overflow:hidden;background:#FBFBF9}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;background:#FBFBF9;color:var(--ink);overflow:hidden}
.slide.on{opacity:1;visibility:visible}
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding-block:12px;padding-inline:16px;background:var(--card);border-top:1px solid var(--hair);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.cbtn{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--card)}
.cbtn:hover{border-color:#D4D7D0;color:var(--ink)}
.cbtn svg{width:18px;height:18px}
.cbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{font-size:14px;font-weight:700;min-width:64px;text-align:center;color:var(--ink2)}
.count b{color:var(--ink)}
.notes{flex:none;max-height:0;overflow:hidden;background:var(--card);transition:max-height .25s}
.notes.open{max-height:200px;border-top:1px solid var(--hair)}
.notes p{padding:14px 20px;font-size:15px;line-height:1.55;color:var(--ink2);max-width:980px;margin:0 auto}
.notes p b{color:var(--ink)}
.deck:fullscreen{background:#E9EBE6}
.deck:fullscreen .ctrl{opacity:.0;transition:opacity .2s}.deck:fullscreen .ctrl:hover{opacity:1}

/* slide primitives (px on the 1600×900 canvas) */
.s-pad{position:absolute;inset:0;padding:96px 110px}
.eyebrow{font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron-d)}
.s-h1{font-size:112px;font-weight:800;letter-spacing:-.035em;line-height:.98}
.s-h2{font-size:60px;font-weight:800;letter-spacing:-.025em;line-height:1.06;text-wrap:balance}
.s-lead{font-size:28px;line-height:1.45;color:var(--ink2);font-weight:600}
.s-body{font-size:24px;line-height:1.5;color:var(--ink2);font-weight:600}
.s-foot{position:absolute;left:110px;right:110px;bottom:44px;display:flex;justify-content:space-between;font-size:16px;color:var(--ink3);font-weight:700}
.s-foot .tri{width:4px;height:16px}
.s-foot span{display:flex;gap:10px;align-items:center}
.panel{position:absolute;top:0;right:0;bottom:0;background:#F0F1EC}
.pt-list{display:flex;flex-direction:column;gap:26px;margin-top:44px}
.pt{display:flex;gap:20px;align-items:flex-start}
.pt .pi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.pt .pi svg{width:26px;height:26px}
.pt b{display:block;font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.pt span{display:block;font-size:22px;line-height:1.45;color:var(--ink2);margin-top:4px}
.sphone{position:absolute;transform-origin:top left}

/* ===== App pane ===== */
.apppane{height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-inline:20px}
.guide{width:400px;flex:none;max-height:100%;overflow-y:auto;padding-block:8px;scrollbar-width:none}
.guide::-webkit-scrollbar{display:none}
.guide .eyebrow{font-size:12px;margin-bottom:10px}
.guide h2{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-bottom:8px}
.gsub{font-size:15px;color:var(--ink2);margin-bottom:18px}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{border-radius:20px;transition:background .2s,box-shadow .2s}
.gitem.on{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px -14px rgba(16,24,40,.18)}
.ghead{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;text-align:left;border-radius:20px}
.ghead:hover{background:rgba(255,255,255,.6)}
.gitem.on .ghead:hover{background:none}
.gico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.gico svg{width:22px;height:22px}
.gnum{font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--ink3);width:14px;flex:none}
.gt{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1}
.gbody{display:none;padding:0 18px 16px 98px}
.gitem.on .gbody{display:block;animation:fadein .25s}
.gbody ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.gbody li{font-size:15px;line-height:1.45;color:var(--ink2);position:relative;padding-left:14px}
.gbody li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.gtry{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--saffron-d);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.gtry svg{width:15px;height:15px;flex:none;margin-top:2px}
.phonewrap{flex:none;position:relative}
@media (max-width:860px){
  .guide{display:none}
  .apppane{padding:0;display:block}
  .apppane .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .apppane .phone .screen{border-radius:0}
  .apppane .phone .island{display:none}
  .apppane .phonewrap{height:100%}
}

/* ===== Phone (shared by app pane and slides) ===== */
.phone{width:414px;height:868px;border-radius:60px;padding:12px;background:linear-gradient(145deg,#2A2D31,#121416);box-shadow:0 40px 80px -30px rgba(16,24,40,.45),inset 0 0 0 1.5px #3A3E43;position:relative;font-family:var(--f-ui);color:var(--ink);text-align:left}
.screen{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg)}
.island{position:absolute;left:50%;top:11px;width:118px;height:34px;border-radius:20px;background:#0B0C0D;transform:translateX(-50%);z-index:60}
.sbar{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:700;z-index:55;pointer-events:none}
.sbar svg{height:12px}
.view{position:absolute;left:0;right:0;top:50px;bottom:0;overflow-y:auto;overflow-x:hidden;padding-bottom:140px;scrollbar-width:none}
.view::-webkit-scrollbar,.lscroll::-webkit-scrollbar,.hs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 24px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--hair);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#A3A8AD;letter-spacing:.01em}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--ink)}
.tabbar button.hero{color:var(--saffron-d);font-weight:800}
.tabbar button.hero .hb{width:58px;height:58px;margin-top:-30px;margin-bottom:1px;border-radius:50%;background:linear-gradient(160deg,#F8913F,#E0540A);display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(224,84,10,.6),0 0 0 5px #fff;transition:transform .15s}
.tabbar button.hero .hb svg{width:28px;height:28px}
.tabbar button.hero:active .hb{transform:scale(.94)}
.tabbar button.hero.on .hb{box-shadow:0 10px 20px -8px rgba(224,84,10,.6),0 0 0 5px #fff,0 0 0 7px var(--saffron-l)}
.layer{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;animation:lin .28s cubic-bezier(.2,.8,.2,1)}
.layer.white{background:var(--card)}
@keyframes lin{from{transform:translateY(24px);opacity:0}}
.lscroll{flex:1;overflow-y:auto;scrollbar-width:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:70;white-space:nowrap;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.scrim{position:absolute;inset:0;background:rgba(18,20,22,.32);z-index:65;display:flex;align-items:flex-end;animation:fadein .2s}
.sheet{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:10px 22px 30px;animation:sup .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#D9DCD6;margin:0 auto 16px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px}
.sheet p{font-size:15px;line-height:1.5;color:var(--ink2);margin-bottom:18px}
@keyframes sup{from{transform:translateY(100%)}}

/* app primitives */
.pg{padding:6px 20px 0}
.kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.ltitle{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 12px}
.sec h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sec .lk{font-size:14px;font-weight:700;color:var(--saffron-d)}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.10)}
.mx{margin:0 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--saffron);color:#fff;font-size:16px;font-weight:800;letter-spacing:-.005em;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ink{background:var(--ink)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--hair)}
.btn.ok{background:var(--green-l);color:var(--green-d)}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}
.tiny{font-size:12px;color:var(--ink3);font-weight:600}
.sample{text-align:center;font-size:11.5px;color:var(--ink3);padding:18px 0 4px;font-weight:600}
.ico svg{display:block}

/* Home */
.home-top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 20px 0}
.dose{display:flex;align-items:center;gap:18px;padding:16px 18px}
.dring-w{position:relative;width:92px;height:92px;flex:none}
.dring-w svg{width:100%;height:100%;transform:rotate(-90deg)}
.dring-w b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:600}
.dose-r{min-width:0;flex:1}
.dose-r .big{font-size:40px;font-weight:600;line-height:1}
.dose-r .big span{font-size:16px;color:var(--ink3);font-family:var(--f-ui);font-weight:600;margin-left:3px}
.dose-r p{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:6px}
.dose-s{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--ink2)}
.dose-s span{display:flex;align-items:center;gap:5px}
.dose-s b{font-family:var(--f-num);font-size:17px;font-weight:600;color:var(--ink)}
.dose-s svg{width:15px;height:15px}
.appbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:6px 20px 8px;background:rgba(243,244,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ab-logos{display:flex;align-items:center;gap:12px}
.ab-emb{height:40px;width:auto;display:block}
.ab-fit{height:36px;width:auto;display:block}
.ab-sep{width:1px;height:28px;background:#D9DCD6}
.greet{font-size:17px;font-weight:600;color:var(--ink2);margin-top:6px;line-height:1.25}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFD8BF,#F6A06B);display:grid;place-items:center;color:#7A3410;font-weight:800;font-size:16px;flex:none}
.wk{padding:18px 18px 16px;margin-top:18px}
.wk-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.wk-h .t{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.wk-h .t svg{width:22px;height:22px}
.wk-h .s{font-size:13px;color:var(--ink2);margin-top:3px}
.pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--saffron-l);color:var(--saffron-d);white-space:nowrap}
.pill.g{background:var(--green-l);color:var(--green-d)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dy{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.dy svg{width:36px;height:36px}
.dy.td{color:var(--ink)}
.dy.td span{position:relative}
.dy.td span::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--saffron);transform:translateX(-50%)}
.dz{display:flex;align-items:center;gap:16px;cursor:pointer}
.dz .dose-r .big{font-size:36px}
.dz-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--saffron-d);margin-bottom:6px}
.dz .dose-r p{font-weight:700;color:var(--ink)}
.dz .dose-r p.ok{color:var(--green-d)}
.dz .dose-s{border-top:0;padding-top:0;margin-top:8px}
.dz-c{align-self:center;color:var(--ink3)}
.dz-wk{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
.dz-wk .wk-h{align-items:center}
.dz-wk .wk-h .t{font-size:18px}
.dz-wk .wk-h .t svg{width:20px;height:20px}
.wk-f{font-size:13px;color:var(--ink2);margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);line-height:1.4}
.starts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.st{display:flex;flex-direction:column;align-items:flex-start;padding:14px 14px 14px;min-height:148px;text-align:left;transition:transform .12s}
.st:active{transform:scale(.97)}
.st .si{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;margin-bottom:auto}
.st .si svg{width:26px;height:26px}
.st b{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.st span{font-size:12px;color:var(--ink3);margin-top:2px}
.today{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px}
.today div{text-align:center;border-left:1px solid var(--hair)}
.today div:first-child{border-left:0}
.today b{display:block;font-size:30px;font-weight:600;line-height:1}
.today small{font-size:11.5px;color:var(--ink3);font-weight:700}
.evc{overflow:hidden;display:block;width:calc(100% - 40px);text-align:left}
.evc .ph{height:132px}
.evc .eb{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.evc h4{font-size:17px;font-weight:800;letter-spacing:-.015em}
.evc p{font-size:13px;color:var(--ink2);margin-top:2px}
.chev{color:#B9BEC2;flex:none}.chev svg{width:20px;height:20px}

/* photo placeholder */
.ph{position:relative;overflow:hidden;display:grid;place-items:center}
.ph .phi{opacity:.55}
.ph .phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .phi svg{width:44px;height:44px}
.ph .phl{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(18,20,22,.55)}
.ph .phl svg{width:12px;height:12px}
.datebadge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border-radius:12px;padding:6px 10px;text-align:center;line-height:1}
.datebadge b{display:block;font-size:22px;font-family:var(--f-num);font-weight:700}
.datebadge small{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--saffron-d)}

/* Tracking */
.trk-map{position:relative;height:47%;flex:none;background:#EEF1EC}
.trk-map svg{width:100%;height:100%;display:block}
.chip{position:absolute;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:800;box-shadow:0 4px 14px -6px rgba(16,24,40,.25)}

.trk-sheet{flex:1;margin-top:-26px;position:relative;background:var(--card);border-radius:28px 28px 0 0;padding:22px 22px 26px;display:flex;flex-direction:column;box-shadow:0 -10px 30px -18px rgba(16,24,40,.25)}

.trk-mets b{display:block;font-size:36px;font-weight:600;line-height:1}
.trk-mets small{font-size:11.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.trk-note{font-size:12.5px;color:var(--ink2);margin:14px 0 auto;display:flex;gap:8px;align-items:center}
.trk-note svg{width:16px;height:16px;flex:none}
.trk-ctl{display:flex;gap:12px;align-items:center;margin-top:16px}
.round{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--hair);background:var(--card)}
.round svg{width:22px;height:22px}
.paused .trk-time{color:var(--ink3)}
.cd{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:40}

.cd span{font-size:16px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.cd b.pop{animation:cdp .7s}
@keyframes cdp{from{transform:scale(1.4);opacity:0}}

/* Summary */
.sum-map{height:190px;border-radius:22px;overflow:hidden;margin:6px 20px 0;background:#EEF1EC}
.sum-map svg{width:100%;height:100%;display:block}
.sum-h{padding:20px 20px 0}
.sum-h h2{font-size:30px;font-weight:800;letter-spacing:-.03em}
.sum-h p{font-size:13.5px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;align-items:center}
.sum-h p svg{width:15px;height:15px}
.grid4{display:grid;grid-template-columns:1fr 1fr;margin:16px 20px 0;padding:6px 0}
.grid4 div{padding:12px 16px}
.grid4 div:nth-child(odd){border-right:1px solid var(--hair)}
.grid4 div:nth-child(-n+2){border-bottom:1px solid var(--hair)}
.grid4 b{display:block;font-size:34px;font-weight:600;line-height:1}
.grid4 small{font-size:11.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px}
.lrow+.lrow{border-top:1px solid var(--hair)}
.lrow .li{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.lrow .li svg{width:22px;height:22px}
.lrow b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.lrow small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.lrow .rv{margin-left:auto;text-align:right;flex:none}
.segbar{display:flex;gap:4px;margin-top:8px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--hair)}
.segbar i.f{background:var(--saffron)}

/* Activity */
.seg{display:flex;background:#E9EBE6;border-radius:10px;padding:2px;margin:14px 20px 0}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.rings{display:flex;align-items:center;gap:18px;padding:18px;margin-top:14px}
.rings svg{width:132px;height:132px;flex:none;transform:rotate(-90deg)}
.rl{display:flex;flex-direction:column;gap:12px;min-width:0}
.rl div small{display:block;font-size:12px;font-weight:800;letter-spacing:.02em}
.rl div b{font-size:24px;font-weight:600;line-height:1.05}
.rl div b span{font-size:15px;color:var(--ink3);font-weight:500}
.insight{display:flex;gap:12px;padding:14px 16px;margin-top:10px;align-items:flex-start}
.insight svg{width:20px;height:20px;flex:none;margin-top:1px}
.insight p{font-size:13.5px;line-height:1.45;color:var(--ink2)}
.insight p b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.tile{padding:14px 14px 12px;min-width:0}
.tile .tl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.tile .tl svg{width:15px;height:15px}
.tile .tv{font-size:34px;font-weight:600;line-height:1;margin:10px 0 2px;white-space:nowrap}
.tile .tv span{font-size:15px;color:var(--ink3);font-weight:500;margin-left:3px}
.tile .ts{font-size:11.5px;color:var(--ink3);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:40px;margin-top:12px}
.bars i{flex:1;border-radius:3px;min-height:3px}
.bl{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:var(--ink3);margin-top:4px}
.bl span{flex:1;text-align:center}

/* Events */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 2px;scrollbar-width:none}
.chips button{flex:none;height:36px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink2);background:var(--card);box-shadow:inset 0 0 0 1px var(--hair)}
.chips button.on{background:var(--ink);color:#fff;box-shadow:none}
.feat{display:block;width:calc(100% - 40px);overflow:hidden;text-align:left;margin-top:16px}
.feat .ph{height:200px}
.feat .fb{padding:16px}
.feat h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.cat{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.metas{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.metas span{display:flex;align-items:center;gap:5px}
.metas svg{width:14px;height:14px}
.elist{margin:0 20px;overflow:hidden}
.er{display:flex;gap:14px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.er+.er{border-top:1px solid var(--hair)}
.er .ph{width:64px;height:64px;border-radius:14px;flex:none}
.er .ph .phi svg{width:24px;height:24px}
.er h4{font-size:15.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.er .d{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.er small{font-size:12.5px;color:var(--ink3)}
.regd{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:var(--green-d);background:var(--green-l);padding:5px 9px;border-radius:999px}

/* Event page */
.ep-hero{position:relative;height:290px;flex:none}
.ep-hero .ph{height:100%}
.ep-back{position:absolute;left:16px;top:58px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 4px 14px -6px rgba(16,24,40,.3);z-index:3}
.ep-back svg{width:20px;height:20px}
.ep-b{padding:20px 20px 0}
.ep-b h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:6px 0 16px}
.fact{display:flex;gap:14px;align-items:center;padding:10px 0}
.fact+.fact{border-top:1px solid var(--hair)}
.fact .fi{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.fact .fi svg{width:19px;height:19px}
.fact b{display:block;font-size:15px;font-weight:800}
.fact small{font-size:12.5px;color:var(--ink2)}
.about{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:14px}
.icons{display:flex;gap:16px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.ip{flex:none;width:78px;text-align:center}
.ip .av{width:72px;height:72px;border-radius:50%;margin:0 auto 8px;background:var(--soft);box-shadow:inset 0 0 0 1.5px #DADDD7;display:grid;place-items:center;color:#B4B9BD}
.ip .av svg{width:24px;height:24px}
.ip b{display:block;font-size:12.5px;font-weight:800}
.ip small{font-size:11px;color:var(--ink3)}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.hl{flex:none;width:220px}
.hl .ph{height:146px;border-radius:18px}
.hl p{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.4}
.ep-foot{flex:none;display:flex;align-items:center;gap:16px;padding:14px 20px 30px;background:var(--card);border-top:1px solid var(--hair)}
.ep-foot .fc b{display:block;font-size:17px;font-weight:800}
.ep-foot .fc small{font-size:12.5px;color:var(--ink2)}
.ep-foot .btn{flex:1}

/* Profile */
.me{display:flex;align-items:center;gap:16px;padding:8px 20px 0}
.me .avatar{width:64px;height:64px;font-size:24px}
.me h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.me small{font-size:13px;color:var(--ink2)}
.pst{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 20px 0;padding:14px 0}
.pst div{text-align:center;border-left:1px solid var(--hair)}
.pst div:first-child{border-left:0}
.pst b{display:block;font-size:30px;font-weight:600;line-height:1}
.pst small{font-size:11.5px;color:var(--ink3);font-weight:700}
.goal{padding:18px}
.goal-r{display:flex;justify-content:space-between;align-items:center;gap:14px}
.goal-r h4{font-size:16px;font-weight:800}
.goal-r p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.4}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hair);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink)}
.stepper b{font-size:34px;font-weight:600;width:30px;text-align:center;line-height:1}
.goal .segbar{margin-top:16px}
.goal .segbar i{height:8px;border-radius:4px}
.goal .cap{font-size:12.5px;color:var(--ink2);margin-top:12px}
.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;padding:18px 10px}
.aw{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.medal{width:64px;height:64px;display:grid;place-items:center;position:relative}
.medal svg{width:26px;height:26px;position:relative}
.aw span{font-size:11px;font-weight:800;line-height:1.2;color:var(--ink)}
.aw.lk span{color:var(--ink3)}
.aw.nw .medal{animation:mp .8s}
@keyframes mp{40%{transform:scale(1.2) rotate(-10deg)}}
.cred{padding:18px}
.cred-h{display:flex;justify-content:space-between;align-items:flex-start}
.cred-h small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d)}
.cred-h .bal{font-size:60px;font-weight:600;line-height:.95;color:var(--ink);margin-top:6px}
.partner{text-align:right;font-size:11px;color:var(--ink3);font-weight:700}
.partner b{display:block;font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.cred-f{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.cred-f div{border-left:1px solid var(--hair);padding-left:12px}
.cred-f div:first-child{border-left:0;padding-left:0}
.cred-f b{display:block;font-size:22px;font-weight:600;line-height:1}
.cred-f small{font-size:11px;color:var(--ink3);font-weight:700}
.rbtn{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;background:var(--green);color:#fff;flex:none}
.rbtn[disabled]{background:var(--soft);color:var(--ink3);cursor:default}
.rbtn.dn{background:var(--green-l);color:var(--green-d)}


/* slide 4: rings draw in each time the slide opens, then breathe */
.ringanim{will-change:transform;contain:layout paint}
.slide.on .ringanim .ra{animation:rdraw 2.2s cubic-bezier(.33,1,.68,1) both}
@keyframes rdraw{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--t)}}
/* cover: phone cycling through languages */
.lcyc{position:absolute;left:0;top:0;width:414px;height:868px}
.lcyc>.lv{position:absolute;inset:0;opacity:0}
.lcyc>.lv:first-child{opacity:1}
.slide.on .lcyc>.lv{animation:lfade 12s infinite both}
.slide.on .lcyc>.lv:nth-child(2){animation-delay:-9s}.slide.on .lcyc>.lv:nth-child(3){animation-delay:-6s}.slide.on .lcyc>.lv:nth-child(4){animation-delay:-3s}
@keyframes lfade{0%{opacity:0}3%{opacity:1}25%{opacity:1}28%{opacity:0}100%{opacity:0}}
.lv.alt .kicker{letter-spacing:0;text-transform:none}
.lv[lang=ta] .wk-h .t{font-size:18px}
.lpills{position:absolute;display:flex;gap:8px;transform:translateX(-50%);white-space:nowrap}
.lpills .lmore{font-style:normal;padding:7px 14px;border-radius:999px;font-size:17px;font-weight:700;color:var(--saffron-d);background:var(--saffron-l)}
.lpills span{padding:7px 14px;border-radius:999px;font-size:17px;font-weight:700;color:var(--ink2);background:#fff;box-shadow:inset 0 0 0 1px var(--hair)}
.slide.on .lpills span{animation:lpill 12s infinite both}
.lpills span:first-child{background:var(--ink);color:#fff;box-shadow:none}
.slide.on .lpills span:nth-child(2){animation-delay:-9s}.slide.on .lpills span:nth-child(3){animation-delay:-6s}.slide.on .lpills span:nth-child(4){animation-delay:-3s}
@keyframes lpill{0%,27%{background:var(--ink);color:#fff;box-shadow:none}28%,100%{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair)}}
/* ===== Social, sharing, notifications ===== */
.hdr-act{display:flex;align-items:center;gap:10px;flex:none}
.bellb{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(16,24,40,.06),inset 0 0 0 1px var(--hair)}

.bellb i{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.push{position:absolute;left:10px;top:52px;width:calc(100% - 20px);z-index:90;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 40px -14px rgba(16,24,40,.38),0 0 0 1px rgba(16,24,40,.05);text-align:left;animation:pdrop .45s cubic-bezier(.2,.9,.25,1.1)}

@keyframes pup{to{transform:translateY(-140%);opacity:0}}
.push .pa{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden}

.lhead{display:flex;align-items:center;gap:12px;padding:56px 16px 10px;flex:none}
.lhead h2{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none;box-shadow:inset 0 0 0 1px var(--hair)}
.ibtn svg{width:20px;height:20px}
.tlink{font-size:13.5px;font-weight:800;color:var(--saffron-d)}
.ngrp{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:16px 20px 8px}
.nrow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;text-align:left;position:relative}
.nrow+.nrow{border-top:1px solid var(--hair)}

.nrow .nb{flex:1;min-width:0;display:block}

.cc{display:block;width:calc(100% - 40px);text-align:left;padding:16px;margin:0 20px 10px}

function evPhoto(e){return e&&e.photo==="SOC"?SOC_PHOTO:""}
const ROUTE=(()=>{const p=[];for(let i=0;i<=120;i++){const t=i/120;p.push([70+250*t+38*Math.sin(t*10),330-235*t+34*Math.sin(t*6+1)])}return p})();
function mapSVG(k,p,vb){
  const col=T[k].hex, n=Math.max(2,Math.round(ROUTE.length*Math.min(1,p)));
  const pts=ROUTE.slice(0,n).map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ");
  const e=ROUTE[n-1], s=ROUTE[0];
  return `<svg viewBox="${vb||"0 0 390 400"}" preserveAspectRatio="xMidYMid slice" aria-label="Route map"><rect width="390" height="400" fill="#EEF1EC"/>
  <ellipse cx="300" cy="110" rx="90" ry="58" fill="#DCEBD7"/><ellipse cx="80" cy="80" rx="70" ry="34" fill="#D7E6EF"/><rect x="40" y="250" width="70" height="50" rx="10" fill="#E4E8E1"/><rect x="250" y="270" width="90" height="60" rx="10" fill="#E4E8E1"/>
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"><path d="M-10 230 L400 190"/><path d="M150 -10 L190 410"/><path d="M-10 120 L400 150"/><path d="M300 -10 L270 410"/></g>
  <g stroke="#E2E6DE" stroke-width="5" stroke-linecap="round"><path d="M-10 40 L400 60"/><path d="M60 -10 L80 410"/><path d="M-10 350 L400 330"/><path d="M360 -10 L370 410"/></g>
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${s[0]}" cy="${s[1]}" r="7" fill="#fff" stroke="${col}" stroke-width="4"/>
  <circle cx="${e[0]}" cy="${e[1]}" r="18" fill="${col}" opacity=".18"/><circle cx="${e[0]}" cy="${e[1]}" r="9" fill="${col}" stroke="#fff" stroke-width="3.5"/></svg>`;
}
function ringA(r,w,p,col,track,d){const C=2*Math.PI*r;return `<circle r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><circle class="ra" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="--c:${C};--t:${C*(1-p)};animation-delay:${d}s"/>`}
function weekStatus(){
  const a=activeDays(),g=S.goal;
  if(a>=g)return{a,g,met:true,txt:`Goal met. Your streak grows to ${S.streakWks} weeks on Sunday.`};
  const left=g-a, daysLeft=7-TODAY;
  return{a,g,met:false,txt:`${left} more active day${left>1?"s":""} keeps your streak alive. ${daysLeft} days left this week.`};
}

/* ================= SCREENS (return HTML) ================= */
function scrHome(){
  const ws=weekStatus(), ev=EVENTS[0], w=S.week;
  const days=DL.map((d,i)=>{
    const m=w.min[i],on=m>=15,fut=i>TODAY;
    const col=on?"#F26B1D":"#F7B48A";
    return `<div class="dy ${i===TODAY?"td":""}"><svg viewBox="-20 -20 40 40" style="transform:rotate(-90deg)">${fut?`<circle r="15" fill="none" stroke="#ECEDE9" stroke-width="5" stroke-dasharray="2 4"/>`:ring(15,5,m/30,col,"#F3EEE9")}${on?`<path d="M-5 0.5l3.5 3.5L5.5-3" transform="rotate(90)" fill="none" stroke="#F26B1D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}</svg><span>${d}</span></div>`;
  }).join("");
  return `
  <div class="home-top"><div style="min-width:0;padding-top:6px"><p class="greet">Good evening,</p><h1 class="ltitle" style="font-size:28px;line-height:1.12;text-wrap:balance">Priyadarshini Sharma</h1></div></div>
  <div class="pg"><div class="card wk">
    ${(()=>{const m=w.min[TODAY],done=m>=30;return `<div class="dz" data-a="tab" data-k="activity" role="button" tabindex="0" aria-label="Today's fitness dose. Open Activity"><div class="dring-w"><svg viewBox="-46 -46 92 92" aria-hidden="true">${ring(38,11,m/30,"#F26B1D","#FBE3D3")}</svg><b class="num">${Math.min(100,Math.round(m/30*100))}%</b></div>
     <div class="dose-r"><div class="dz-k">Today's fitness dose</div><div class="big num">${fmt(m)}<span>/30 min</span></div><p class="${done?"ok":""}">${done?"Done for today":`${30-m} mins to go`}</p>
     <div class="dose-s"><span>${ic("shoe","#9AA0A6",2.2)}<b>${fmt(w.steps[TODAY])}</b><small>steps</small></span><span>${ic("route","#9AA0A6",2.2)}<b>${f1(w.km[TODAY])}</b><small>km</small></span></div></div><span class="chev dz-c">${ic("chev")}</span></div>`})()}
    <div class="dz-wk"><div class="wk-h"><div><div class="t">${ic("flame","#F26B1D",2.2)}${S.streakWks}-week streak</div></div><span class="pill ${ws.met?"g":""}">${ws.a} of ${ws.g} days</span></div>
    <div class="days">${days}</div>
    <div class="wk-f" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span>${ws.txt}</span><button class="tlink" data-a="share" data-k="streak" style="flex:none;display:flex;align-items:center;gap:5px">${ic("share","currentColor",2.2).replace("<svg",'<svg width="15" height="15"')}Share</button></div></div>
  </div></div>
  <div class="sec"><h3>Start a workout</h3></div>
  <div class="starts">${["cycle","run","walk"].map(k=>{const t=T[k];return `<button class="card st" data-a="start" data-k="${k}"><span class="si" style="background:${t.cl}">${ic(t.ico,t.cd,2.1)}</span><b>${t.short}</b><span>${t.last}</span></button>`}).join("")}</div>
  <div class="sec"><h3>Your circles</h3><span class="lk" data-a="tab" data-k="circles" role="button" tabindex="0">See all</span></div>
  ${circleCard(S.circles.find(c=>c.id==="office")||S.circles[0])}
  <div class="sec" style="padding-top:16px"><h3>Next event</h3><span class="lk" data-a="tab" data-k="events" role="button" tabindex="0">All events</span></div>
  <button class="card evc mx" data-a="event" data-k="${ev.id}">${ph(ev.col,ev.ico,"Event photo","",`<span class="datebadge"><b>${ev.dd}</b><small>${ev.mm}</small></span>`,evPhoto(ev))}
   <div class="eb"><div><h4>${ev.n}</h4><p>${ev.time} · ${S.regs[ev.id]?"You're registered":"Free registration"}</p></div><span class="chev">${ic("chev")}</span></div></button>`;
}

   {l:"Active minutes",ico:"clock",c:"#0E9F6E",v:fmt(wkMin),u:"min",s:`Today ${fmt(today)} min`,a:w.min},

  ];

  return `
  <div class="pg"><h1 class="ltitle">Activity</h1></div>
  <div class="seg" role="group" aria-label="Range"><button class="on">Week</button><button data-a="soon">Month</button><button data-a="soon">Year</button></div>
  <div class="pg"><div class="card rings">
    <svg viewBox="-66 -66 132 132" aria-label="Today's rings">${ring(56,13,today/30,"#F26B1D","#FBE3D3")}${ring(40,13,w.km[TODAY]/5,"#4B5BDC","#E1E4F8")}${ring(24,13,w.steps[TODAY]/8000,"#0E9F6E","#D6EFE4")}</svg>

      <div><small style="color:#D85A10">Daily dose</small><b class="num">${fmt(today)}<span>/30 min</span></b></div>

   case "joincircle": sheet(`<h3>Join a circle</h3><p>Enter the code a friend shared with you.</p><input class="field" id="jCode" placeholder="FIT-0000" maxlength="8" style="margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em" autocomplete="off"><div class="row"><button class="btn line" data-x>Cancel</button><button class="btn" data-ok>Join</button></div>`,()=>toast("Request sent to the circle admin"));break;
   case "ctype": live.layer.querySelectorAll("#cTypes button").forEach(b=>b.classList.toggle("on",b===el));break;
   case "cpriv": live.layer.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===el));break;
   case "create": {const nm=(live.layer.querySelector("#cName").value||"").trim()||"My Circle",ty=live.layer.querySelector("#cTypes .on").dataset.k,pv=live.layer.querySelector(".opt.on").dataset.k,id="c"+Date.now();
     S.circles.unshift({id,n:nm,type:ty,priv:pv,code:"FIT-"+(1000+Math.floor(Math.random()*9000)),goal:300,members:[],feed:[]});S.tab="circles";S.cseg="mine";render();openLayer(lyCircle(id));toast("Circle created. Invite your people.");break;}
   case "copycode": {const c=S.circles.find(x=>x.id===k);copyText(c.code);toast("Code "+c.code+" copied");break;}
   case "invite": {const c=S.circles.find(x=>x.id===k);copyText(`Join my circle "${c.n}" on the Fit India app. Code: ${c.code}`);toast("Invite link copied. Paste it in any chat.");break;}
   case "share": openShare(k,el.dataset.d);setGuide("share");break;
   case "sfmt": S.share.fmt=k;live.share.innerHTML=lyShare();break;
   case "ssty": S.share.sty=k;live.share.innerHTML=lyShare();break;
   case "sdest": live.share.innerHTML="";toast(k==="Save image"?"Saved to your photos":k==="More"?"Choose an app to share with":"Shared to "+k);break;
   case "sclose": live.share.innerHTML="";break;
   case "redeem": {setGuide("credits");const r=REWARDS.find(x=>x.id===k);if(S.redeemed[k]){toast("Check the FitSpire app for your reward");break}
     sheet(`<h3>Redeem ${r.n}?</h3><p>${r.c} Carbon Credits will be used and you'll have ${fmt(S.credits-r.c)} left. FitSpire sends the reward to your registered phone and email.</p><div class="row"><button class="btn line" data-x>Cancel</button><button class="btn" style="background:var(--green)" data-ok>Redeem</button></div>`,()=>{S.credits-=r.c;S.redeemed[k]=true;render(true);toast("Redeemed with FitSpire")});break;}
   case "pause": if(!trk)break;trk.paused=!trk.paused;live.layer.querySelector("#trk").classList.toggle("paused",trk.paused);el.innerHTML=ic(trk.paused?"play":"pause","#121416",2.4);break;
   case "finish": finishTrack();break;
   case "done": closeLayer();S.tab="home";render();if(S.pending){const pn=S.pending;S.pending=null;setTimeout(()=>push(pn),700)}break;
  }
}
function countdown(k){
  openLayer(`<div class="layer white"><div class="cd"><b class="num pop" id="cdn">3</b><span>${T[k].name.toUpperCase()} · GET READY</span></div></div>`);
  let n=3;const iv=setInterval(()=>{n--;const el=live.layer.querySelector("#cdn");if(!el){clearInterval(iv);return}
    if(n===0){clearInterval(iv);startTrack(k);return}el.textContent=n;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")},700);
}
function startTrack(k){
  trk={k,sec:0,km:0,paused:false};openLayer(lyTrack(k,0,0,false));
  const t=T[k];
  trk.iv=setInterval(()=>{
    if(!trk||trk.paused)return;
    trk.sec+=2;trk.km=trk.sec/3600*t.kmh*(0.96+0.08*Math.sin(trk.sec/240));
    const q=id=>live.layer.querySelector("#"+id);if(!q("tTime"))return;
    q("tTime").textContent=clockStr(trk.sec);q("tKm").textContent=trk.km.toFixed(2);q("tPace").textContent=paceStr(k,trk.sec,trk.km);q("tCr").textContent=Math.floor(trk.km*1.2);
    if(trk.sec%60===0){q("trkMap").firstElementChild.outerHTML=mapSVG(k,trk.km/(t.kmh*0.4));if(trk.sec===900)q("tNote").innerHTML=ic("check","#0E9F6E",2.4)+"This workout now counts as an active day."}
  },33);
}
function stopTrack(){if(trk){clearInterval(trk.iv);trk=null}}
function finishTrack(){
  if(!trk)return;if(trk.sec<60){toast("Keep moving a little longer");return}
  const k=trk.k,min=Math.round(trk.sec/60),km=trk.km;stopTrack();
  const t=T[k],cr=Math.floor(km*1.2),co2=km*0.12,kcal=Math.round(min*t.kpm);
  const wasActive=S.week.min[TODAY]>=15,before=activeDays(),oc=S.circles.find(c=>c.id==="office"),rb=oc?circleRank(oc):0,lbb=lbRank(myMin(),"india");
  S.week.min[TODAY]+=min;S.week.km[TODAY]+=km;S.week.kcal[TODAY]+=kcal;if(k!=="cycle")S.week.steps[TODAY]+=Math.round(km*1300);
  S.wkCount++;S.credits+=cr;S.co2kg+=co2;if(k==="cycle")S.cycKm+=km;if(k==="run")S.longestRun=Math.max(S.longestRun,km);
  S.history.unshift({t:k,d:"Today",time:"7:45 PM",km,min,cr});
  const after=activeDays(),goalJustMet=before<S.goal&&after>=S.goal;
  if(goalJustMet)S.streakWks++;
  const newly=[];BADGES.forEach(b=>{if(!S.earned[b.id]&&b.p&&b.id!=="event"){const[v,m]=b.p(S);if(v>=m){S.earned[b.id]=true;newly.push(b)}}});
  S.newBadge=newly[0]?newly[0].id:null;
  let sb,ss;const counted=min>=15;
  if(goalJustMet){sb="Weekly goal met";ss=`Your streak is now ${S.streakWks} weeks.`}
  else if(counted&&!wasActive){sb="Active day done";ss=`${after} of ${S.goal} days this week · ${Math.max(0,S.goal-after)} to go`}
  else if(counted){sb="Today was already active";ss=`${after} of ${S.goal} days this week`}
  else{sb=`${15-min} min short of an active day`;ss="Workouts of 15 min or more count towards your streak"}
  const ra=oc?circleRank(oc):0,lba=lbRank(myMin(),"india");
  S.lastWorkout={k,km,min,cr,d:"Today"};
  if(oc&&ra<rb){const ahead=circleRows(oc)[ra-2];S.pending={t:"rank",title:`You moved up to #${ra} in ${oc.n}`,body:ahead?`${myMin()} min this week. ${ahead.m-myMin()} min behind ${ahead.n.split(" ")[0]} for #${ra-1}.`:`${myMin()} min this week. You lead the circle.`,go:{a:"circle",k:"office"}}}
  else S.pending={t:"credits",title:`${cr} Carbon Credits verified`,body:`From your ${t.title.toLowerCase()} today.`,go:{a:"tab",k:"profile"}};
  openLayer(lySummary({k,min,km,cr,co2,kcal,after,sb,ss,newly,lb:lbb>lba?{up:lbb-lba,to:lba}:null}));
}

];
let gActive="home";
function renderGuide(){
  const el=document.getElementById("glist");if(!el)return;
  el.innerHTML=GUIDE.map((g,i)=>`<div class="gitem ${g.k===gActive?"on":""}"><button class="ghead" data-g="${g.k}" aria-expanded="${g.k===gActive}"><span class="gnum">${i+1}</span><span class="gico" style="background:${g.bg}">${ic(g.ico,g.c,2.1)}</span><span class="gt">${g.t}</span></button><div class="gbody"><ul>${g.pts.map(x=>`<li>${x}</li>`).join("")}</ul><div class="gtry">${ic("arrowup","currentColor",2.4).replace("<svg",'<svg style="transform:rotate(90deg)"')}<span>Try it: ${g.try}</span></div></div></div>`).join("");
}
function setGuide(k){if(k&&k!==gActive){gActive=k;renderGuide()}}
const TAB2G={home:"home",activity:"activity",circles:"circles",events:"events",profile:"badges"};
function guideGo(k){
  gActive=k;renderGuide();
  stopTrack();closeLayer();live.share.innerHTML="";live.screen.querySelectorAll(".scrim,.push").forEach(x=>x.remove());
  if(k==="share"){S.tab="home";render();openLayer(lyNotifs());}
  else if(k==="credits"){S.tab="profile";render();const c=live.view.querySelector("#credCard");if(c)live.view.scrollTo({top:c.offsetTop-70,behavior:"smooth"});}
  else{S.tab=({badges:"profile"})[k]||k;render();}
  gActive=k;renderGuide();
}
document.getElementById("glist").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(b)guideGo(b.dataset.g)});

const BASE_STATE=clone(S0);
function stPhone(o,x,y,scale){ // static phone on a slide
  const html=withState(clone(BASE_STATE),()=>{const st=S;if(o.prep)o.prep(st);return phoneHTML({tab:o.tab,offset:o.offset,layer:o.layer?o.layer():""})});
  return `<div class="sphone" style="left:${x}px;top:${y}px;transform:scale(${scale})" aria-hidden="true">${html}</div>`;
}

function translateHTML(h,L){
  if(!L.t)return h;
  Object.keys(L.t).sort((a,b)=>b.length-a.length).forEach(en=>{h=h.split(">"+en+"<").join(">"+L.t[en]+"<")});
  let i=0;h=h.replace(/(<div class="dy[^"]*">[\s\S]*?<span>)([A-Z])(<\/span>)/g,(m,a,b,c)=>a+(L.days[i++]||b)+c);
  return h;
}

let cur=0;
function buildDeck(){
  const st=document.getElementById("stage");
  st.innerHTML=SLIDES.map((s,i)=>`<section class="slide${i===0?" on":""}" aria-label="Slide ${i+1}">${s.html().replace("__PG__",`${i+1} / ${SLIDES.length}`)}</section>`).join("");
  go(0);fit();
}
function go(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  document.querySelectorAll(".slide").forEach((s,j)=>s.classList.toggle("on",j===cur));
  document.getElementById("count").innerHTML=`<b>${cur+1}</b> / ${SLIDES.length}`;
  document.getElementById("notesText").innerHTML=SLIDES[cur].notes;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SLIDES.length-1;
}
function fit(){
  const w=document.getElementById("stagewrap"),st=document.getElementById("stage");
  if(!w.clientWidth)return;
  const s=Math.min((w.clientWidth-32)/1600,(w.clientHeight-32)/900);
  st.style.transform=`translate(-50%,-50%) scale(${Math.max(.1,s)})`;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("notesBtn").onclick=e=>{const n=document.getElementById("notes");const o=n.classList.toggle("open");e.currentTarget.classList.toggle("on",o);e.currentTarget.setAttribute("aria-pressed",o);setTimeout(fit,260)};
document.getElementById("fsBtn").onclick=()=>{const d=document.getElementById("deck");try{if(document.fullscreenElement)document.exitFullscreen();else{const p=d.requestFullscreen&&d.requestFullscreen();p&&p.catch&&p.catch(()=>{})}}catch(_){}};
document.addEventListener("fullscreenchange",()=>setTimeout(fit,60));
document.addEventListener("keydown",e=>{
  if(document.getElementById("p-deck").hidden)return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(SLIDES.length-1);
  else if(e.key==="n"||e.key==="N")document.getElementById("notesBtn").click();
  else if(e.key==="f"||e.key==="F")document.getElementById("fsBtn").click();
});
window.addEventListener("resize",fit);

  const deck=which!=="app";
  document.getElementById("t-deck").setAttribute("aria-selected",deck);document.getElementById("t-app").setAttribute("aria-selected",!deck);
  document.getElementById("p-deck").hidden=!deck;document.getElementById("p-app").hidden=deck;
  if(deck)requestAnimationFrame(fit);
  else if(!live.greeted){live.greeted=true;setTimeout(()=>{if(!document.getElementById("p-app").hidden)push({t:"event",title:"Sundays on Cycle is this Sunday",body:"6:30 AM · Major Dhyan Chand National Stadium. You're registered.",go:{a:"event",k:"soc"}},false)},1600)}
  try{history.replaceState(null,"",deck?"#deck":"#app")}catch(_){}
}
document.getElementById("t-deck").onclick=()=>showTab("deck");
document.getElementById("t-app").onclick=()=>showTab("app");

buildDeck();mountLive();renderGuide();
showTab(location.hash==="#app"?"app":"deck");
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
</script>
